name: Release (smartphonekey)

# Publishes stable GitHub Releases for smartphonekey/t3code with the same CLI archive
# layout upstream's updater expects (SHA256SUMS + per-platform t3-<version>-<platform>-<arch>.*).
# Builds from this repository at the tagged commit — never re-uploads pingdotgg assets.
# No schedule: cutting a release stays an explicit maintainer action (tag push or dispatch).

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
      - "!v*-preview.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version without the v prefix (required when not triggered by a tag)"
        required: false
        type: string

concurrency:
  group: release-smartphonekey-stable
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  preflight:
    name: Preflight
    if: github.repository == 'smartphonekey/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      ref: ${{ github.sha }}
      release_channel: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - id: release_meta
        name: Resolve release version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw="${DISPATCH_VERSION:-}"
            if [[ -z "$raw" ]]; then
              echo "workflow_dispatch requires the version input when no tag triggered the run." >&2
              exit 1
            fi
          else
            raw="${GITHUB_REF_NAME}"
          fi
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $raw" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "name=T3 Code v$version" >> "$GITHUB_OUTPUT"

  relay_public_config:
    name: Resolve public client config
    needs: [preflight]
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      clerk_publishable_key: ${{ steps.public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.public_config.outputs.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: public_config
        name: Read defaults from .env.example
        shell: bash
        run: |
          set -euo pipefail
          env_example() { sed -n "s|^T3CODE_$1=||p" .env.example; }
          CLERK_PUBLISHABLE_KEY="$(env_example CLERK_PUBLISHABLE_KEY)"
          CLERK_JWT_TEMPLATE="$(env_example CLERK_JWT_TEMPLATE)"
          CLERK_CLI_OAUTH_CLIENT_ID="$(env_example CLERK_CLI_OAUTH_CLIENT_ID)"
          RELAY_DOMAIN="$(sed -n 's|^T3CODE_RELAY_URL=https://||p' .env.example)"
          if [[ -z "$RELAY_DOMAIN" ]]; then
            echo "Missing T3CODE_RELAY_URL in .env.example" >&2
            exit 1
          fi
          echo "clerk_publishable_key=$CLERK_PUBLISHABLE_KEY" >> "$GITHUB_OUTPUT"
          echo "clerk_jwt_template=$CLERK_JWT_TEMPLATE" >> "$GITHUB_OUTPUT"
          echo "clerk_cli_oauth_client_id=$CLERK_CLI_OAUTH_CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "relay_url=https://$RELAY_DOMAIN" >> "$GITHUB_OUTPUT"

  build_bundle:
    name: Build JS bundle
    needs: [preflight, relay_public_config]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.relay_public_config.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.relay_public_config.outputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.relay_public_config.outputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.relay_public_config.outputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ needs.relay_public_config.outputs.relay_url }}
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - id: bundle_build
        name: Check bundle-only build support
        run: |
          script="$(node -p "require('./package.json').scripts['build:desktop:bundle'] ? 'build:desktop:bundle' : 'build:desktop'")"
          echo "script=$script" >> "$GITHUB_OUTPUT"

      - if: steps.bundle_build.outputs.script == 'build:desktop'
        uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        if: steps.bundle_build.outputs.script == 'build:desktop'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        run: vp run ${{ steps.bundle_build.outputs.script }}

      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop_mac_arm64:
    name: CLI macOS arm64
    needs: [preflight, relay_public_config, build_bundle]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.relay_public_config.result == 'success' && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: stable
      clerk_publishable_key: ${{ needs.relay_public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.relay_public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.relay_public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.relay_public_config.outputs.relay_url }}
      relay_client_tracing: false
      label: macOS arm64
      runner: macos-14
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true
      launch_check: false
      save_pnpm_store: false

  desktop_linux_x64:
    name: CLI Linux x64
    needs: [preflight, relay_public_config, build_bundle]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.relay_public_config.result == 'success' && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: stable
      clerk_publishable_key: ${{ needs.relay_public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.relay_public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.relay_public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.relay_public_config.outputs.relay_url }}
      relay_client_tracing: false
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: false

  desktop_linux_arm64:
    name: CLI Linux arm64
    needs: [preflight, relay_public_config, build_bundle]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.relay_public_config.result == 'success' && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: stable
      clerk_publishable_key: ${{ needs.relay_public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.relay_public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.relay_public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.relay_public_config.outputs.relay_url }}
      relay_client_tracing: false
      label: Linux arm64
      runner: ubuntu-24.04-arm
      platform: linux
      target: AppImage
      arch: arm64
      rust_target: aarch64-unknown-linux-gnu
      resource_key: linux-arm64
      cli_archive: true
      launch_check: false

  desktop_win_x64:
    name: CLI Windows x64
    needs: [preflight, relay_public_config, build_bundle]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.relay_public_config.result == 'success' && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: stable
      clerk_publishable_key: ${{ needs.relay_public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.relay_public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.relay_public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.relay_public_config.outputs.relay_url }}
      relay_client_tracing: false
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2022
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true
      launch_check: false

  desktop_win_arm64:
    name: CLI Windows arm64
    needs: [preflight, relay_public_config, build_bundle]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.relay_public_config.result == 'success' && needs.build_bundle.result == 'success' }}
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: stable
      clerk_publishable_key: ${{ needs.relay_public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.relay_public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.relay_public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.relay_public_config.outputs.relay_url }}
      relay_client_tracing: false
      label: Windows arm64
      runner: ubuntu-24.04
      verify_runner: windows-11-arm
      platform: win
      target: nsis
      arch: arm64
      rust_target: aarch64-pc-windows-msvc
      resource_key: win32-arm64
      cli_archive: true
      launch_check: false

  release:
    name: Publish GitHub Release
    needs:
      [
        preflight,
        desktop_mac_arm64,
        desktop_linux_x64,
        desktop_linux_arm64,
        desktop_win_x64,
        desktop_win_arm64,
      ]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.desktop_mac_arm64.result == 'success' && needs.desktop_linux_x64.result == 'success' && needs.desktop_linux_arm64.result == 'success' && needs.desktop_win_x64.result == 'success' && needs.desktop_win_arm64.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      - name: Write CLI archive checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          archives=(t3-*.tar.gz t3-*.zip)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No CLI archives were produced." >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: |
            release-assets/t3-*.tar.gz
            release-assets/t3-*.zip
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          token: ${{ github.token }}
